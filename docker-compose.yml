version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: meeting-booking-db
    environment:
      POSTGRES_DB: meeting_booking
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting-booking-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: "local-dev-secret"
      DATABASE_URL: "postgres://meeting_user:meeting_password@db:5432/meeting_booking?sslmode=disable"
      CONFERENCE_SERVICE_FAIL: "false"

volumes:
  pgdata:
